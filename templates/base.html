<head>
  <title>Gradebook</title>
  <link href="https://unpkg.com/@primer/css@^20.2.4/dist/primer.css" rel="stylesheet" />

  <!-- 1. Repository Header Navbar -->
  <div class="color-bg-subtle border-bottom px-3 pt-3 mb-4">
    <div class="container-xl">
      <div class="d-flex flex-items-center flex-wrap mb-3">
        <!-- Repo Icon & Breadcrumbs -->
        <div class="f3 d-flex flex-items-center flex-auto min-width-0">
          <svg class="octicon octicon-repo mr-2 color-fg-muted" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 11h3a.75.75 0 0 1 0 1.5H5a.75.75 0 0 1 0-1.5Z"></path>
          </svg>

          <span class="author"><a href="{% url 'home' %}" class="Link">gradebook</a></span>
          <span class="mx-1 color-fg-muted">/</span>

          {% block breadcrumbs %}

          {% endblock %}
        </div>
        <div class="nav-right">
          {% if user.is_authenticated %}
            <form id="account_logout_form" action="{% url 'account_logout' %}" method="post" style="display: none;">
              {% csrf_token %}
            </form>

            <p>
              Logged in as {{ user.username }}!
              <a href="#" onclick="event.preventDefault(); document.getElementById('account_logout_form').submit();">Log Out</a>
            </p>
          {% else %}
            <p>
              <a href="{% url 'account_login' %}">Log In</a> <a href="{% url 'account_signup' %}">Sign Up</a>
            </p>
          {% endif %}
        </div>
      </div>
      {% block navbar %}

      {% endblock %}
    </div>
  </div>

  <body>
    {% block content %}

    {% endblock %}
  </body>
</head>
