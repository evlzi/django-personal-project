{% extends 'account/account_base.html' %}
{% load widget_tweaks %} <!-- pip install django-widget-tweaks -->

{% block breadcrumbs %}
  {{ block.super }}
  <span class="author"><a href="{% url 'account_login' %}" class="Link">login</a></span>
  <span class="mx-1 color-fg-muted">/</span>
{% endblock %}

{% block content %}
  <h2>Log In</h2>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>

        {% render_field field class='form-control' %}
      </div>
    {% endfor %}
    <button class="btn btn-sm btn-primary nav-right" type="submit">Log In</button>
  </form>
{% endblock %}
